<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Track your order | LamaTopup</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#080d1b;--card:#0e1628;--bd:#25324f;--tx:#eef3ff;--mut:#8998b5;--ac:#18d79c;--blue:#4f8bff;--warn:#ffb020;--bad:#ff5d5d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-weight:900;letter-spacing:.5px;text-decoration:none;color:var(--tx)}.brand span{color:var(--ac)}
a.back{color:var(--mut);font-size:14px;text-decoration:none}
h1{font-size:21px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mut{color:var(--mut);font-size:12px}.mono{font:12px ui-monospace,Menlo,monospace;word-break:break-all}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;border:1px solid currentColor;white-space:nowrap}
.awaiting_payment,.payment_submitted{color:var(--warn)}.processing{color:var(--blue)}.completed{color:var(--ac)}.rejected,.cancelled{color:var(--bad)}
.msg{margin:10px 0 2px;font-size:15px;font-weight:700}
.steps{display:flex;margin:14px 0 4px}
.step{flex:1;text-align:center;position:relative;font-size:11px;color:var(--mut)}
.step i{display:block;width:22px;height:22px;margin:0 auto 5px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);position:relative;z-index:1;font-style:normal;font-size:12px;line-height:18px;color:#04150f;font-weight:900}
.step:not(:last-child):after{content:"";position:absolute;top:10px;left:50%;width:100%;height:2px;background:var(--bd)}
.step.done{color:var(--tx)}.step.done i{background:var(--ac);border-color:var(--ac)}.step.done:not(:last-child):after{background:var(--ac)}
.step.now i{border-color:var(--ac);box-shadow:0 0 0 4px #18d79c33;animation:p 1.6s infinite}
@keyframes p{50%{box-shadow:0 0 0 7px #18d79c00}}
.banner{background:#0b2a22;border:1px solid var(--ac);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.pay{margin-top:12px;border-top:1px solid var(--bd);padding-top:12px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:#050a18;color:var(--tx);font:inherit}
.btn{width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#18d79c,#19b8d3);color:#04150f;font:inherit;font-weight:800;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd);font-weight:600}.btn.s{width:auto;margin:0;padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.55}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.err{color:var(--bad);font-size:13px;margin-top:6px}
.empty{text-align:center;padding:26px 14px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:532px;margin:0 auto;background:#eef3ff;color:#080d1b;padding:11px 14px;border-radius:10px;font-size:14px;z-index:9}
.hide{display:none}
</style></head><body><div class="wrap">
<div class="top"><a class="brand" href="/">LAMA<span>TOPUP</span></a><a class="back" href="/">Back to store</a></div>
<h1>Track your order</h1><p class="sub" id="sub">Orders placed on this device appear here and update automatically.</p>
<div id="new" class="banner hide"></div>
<div id="list"></div>
<div id="toast" class="toast hide"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY="lamaOrders",OPEN=["awaiting_payment","payment_submitted","processing"];
let saved=[],data={},errs={},timer=null,fresh=null;
function read(){try{return JSON.parse(localStorage.getItem(KEY)||"[]").filter(x=>x&&x.id&&x.token)}catch(e){return[]}}
function write(){try{localStorage.setItem(KEY,JSON.stringify(saved.slice(0,20)))}catch(e){}}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hide");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add("hide"),3000)}

// pick up ?o=ORDER&t=TOKEN (shared link or redirect after checkout), store it, then clean the URL
(function(){const p=new URLSearchParams(location.search),o=p.get("o"),t=p.get("t");saved=read();
 if(o&&/^[A-Za-z0-9\-]{8,60}$/.test(o)){if(t&&!saved.some(x=>x.id===o)){saved.unshift({id:o,token:t});write()}fresh=o;
  const b=$("#new");b.classList.remove("hide");b.innerHTML="<b>Order placed.</b> Keep this page or save your order ID: <span class='mono'>"+esc(o)+"</span>"}
 if(o||t)history.replaceState(null,"","/track")})();

async function fetchOne(x){
  try{const r=await fetch("/api/orders/"+encodeURIComponent(x.id),{headers:{"X-Order-Token":x.token},cache:"no-store"});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.order){data[x.id]=j.order;delete errs[x.id]}
    else if(r.status===404)errs[x.id]="We couldn't find this order. The link may be incomplete.";
    else if(r.status===429)errs[x.id]="Too many checks. Please wait a minute.";
    else errs[x.id]=j.error||"Could not load this order.";
  }catch(e){errs[x.id]="Connection problem. Retrying..."}}
async function refresh(all){
  const targets=saved.slice(0,10).filter(x=>all||!data[x.id]||OPEN.includes(data[x.id].status));
  await Promise.all(targets.map(fetchOne));draw();
  const anyOpen=saved.slice(0,10).some(x=>!data[x.id]||OPEN.includes(data[x.id].status));
  clearInterval(timer);if(anyOpen)timer=setInterval(()=>{if(!document.hidden)refresh(false)},15000)}

const STEPS=["Placed","Payment sent","Verified","Delivered"];
function stepIndex(s){return s==="awaiting_payment"?0:s==="payment_submitted"?1:s==="processing"?2:3}
function fmt(iso){return iso?new Date(iso).toLocaleString([], {dateStyle:"medium",timeStyle:"short"}):""}
function card(x){
  const o=data[x.id],e=errs[x.id];
  if(!o)return `<div class="card"><div class="mono">${esc(x.id)}</div><div class="${e?"err":"mut"}" style="margin-top:6px">${esc(e||"Loading...")}</div>${e&&!/Connection|Too many/.test(e)?`<button class="btn g s" style="margin-top:10px" onclick="removeOrder('${esc(x.id)}')">Remove</button>`:""}</div>`;
  const dead=o.status==="rejected"||o.status==="cancelled",idx=stepIndex(o.status);
  const steps=dead?"":`<div class="steps">${STEPS.map((l,i)=>`<div class="step ${i<idx||o.status==="completed"?"done":i===idx?"now":""}"><i>${i<idx||o.status==="completed"?"✓":""}</i>${l}</div>`).join("")}</div>`;
  const pay=o.status==="awaiting_payment"?`<div class="pay"><div class="mut">Paid already? Enter the transaction ID from your Fonepay/eSewa receipt so we can verify it.</div>
    <input id="r-${esc(o.id)}" placeholder="Transaction ID" maxlength="60" autocomplete="off"><button class="btn" onclick="sendPay('${esc(o.id)}',this)">I have paid</button><div class="err" id="pe-${esc(o.id)}"></div></div>`:"";
  const ms=o.membership_expires_at&&o.status==="completed"?`<div class="mut" style="margin-top:6px">Active until ${esc(fmt(o.membership_expires_at))}</div>`:"";
  return `<div class="card${o.id===fresh?"":""}"><div class="row"><div><b>${esc(o.product)}</b> <span class="mut">Rs. ${esc(o.amount)}</span><div class="mut">${o.game==="freefire"?"Free Fire":"eFootball"} ID ${esc(o.user_id)}</div></div><span class="pill ${esc(o.status)}">${esc(o.status.replace("_"," "))}</span></div>
   <div class="msg">${esc(o.message)}</div>${steps}${ms}${pay}${e?`<div class="err">${esc(e)}</div>`:""}
   <div class="mut" style="margin-top:8px">Order <span class="mono">${esc(o.id)}</span> · placed ${esc(fmt(o.created_at))}</div>
   <div class="acts"><button class="btn g s" onclick="copyText('${esc(o.id)}','Order ID copied')">Copy order ID</button><button class="btn g s" onclick="copyLink('${esc(o.id)}')">Copy tracking link</button>${OPEN.includes(o.status)?"":`<button class="btn g s" onclick="removeOrder('${esc(o.id)}')">Remove</button>`}</div></div>`}
function draw(){
  if(!saved.length){$("#list").innerHTML=`<div class="card empty"><b>No orders on this device yet</b><p class="mut">Place an order from the store and it will show up here. Opened a tracking link on a new device? Use the full link you were given.</p><a href="/"><button class="btn">Go to store</button></a></div>`;return}
  $("#list").innerHTML=saved.slice(0,10).map(card).join("")}
async function sendPay(id,btn){
  const x=saved.find(s=>s.id===id),v=document.getElementById("r-"+id).value.trim(),er=document.getElementById("pe-"+id);er.textContent="";
  if(v.length<4){er.textContent="Enter the transaction ID from your receipt.";return}
  btn.disabled=true;
  try{const r=await fetch(`/api/orders/${encodeURIComponent(id)}/payment`,{method:"POST",headers:{"Content-Type":"application/json","X-Order-Token":x.token},body:JSON.stringify({payment_ref:v})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||j.success===false)throw new Error(j.error||"Could not send. Try again.");
    data[id]=j.order;toast("Thanks! We are verifying your payment.");draw();refresh(false)}
  catch(e){er.textContent=e.message;btn.disabled=false}}
function copyText(t,m){navigator.clipboard?.writeText(t).then(()=>toast(m),()=>toast("Copy failed"))}
function copyLink(id){const x=saved.find(s=>s.id===id);copyText(location.origin+"/track?o="+encodeURIComponent(id)+"&t="+encodeURIComponent(x.token),"Tracking link copied. Anyone with it can view this order, so keep it private.")}
function removeOrder(id){if(!confirm("Remove this order from this device? You can't undo this unless you saved the tracking link."))return;saved=saved.filter(s=>s.id!==id);delete data[id];delete errs[id];write();draw()}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh(false)});
draw();refresh(true);
</script></body></html>
